<title>จัดหมวด Component</title>
<meta name="description" content="Card sort และ Tree test สำหรับทีม UI เพื่อหาโครง IA ของ design system portal">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --ground:#F3F4F7; --surface:#FFFFFF; --surface-2:#F8F9FB; --line:#DCE0E8; --line-strong:#C3C9D6;
  --ink:#1B2130; --muted:#5B6475; --faint:#8A92A3;
  --accent:#3453D1; --accent-ink:#FFFFFF; --accent-soft:#E7ECFD; --accent-line:#B9C6F6;
  --good:#1E8E5A; --good-soft:#E3F4EB; --warn:#B96F0E; --warn-soft:#FBF0DE; --bad:#C0392B; --bad-soft:#FBE7E4;
  --card-shadow:0 1px 0 rgba(27,33,48,.06),0 1px 3px rgba(27,33,48,.08);
  --r:10px;
  --sans:"IBM Plex Sans Thai",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#11141B; --surface:#1A1E28; --surface-2:#151922; --line:#2B3140; --line-strong:#3A4152;
    --ink:#E8EBF1; --muted:#A0A8B8; --faint:#737C8E;
    --accent:#7F97FF; --accent-ink:#0F1320; --accent-soft:#232C4B; --accent-line:#3C4B80;
    --good:#4CC38A; --good-soft:#15301F; --warn:#E3A54B; --warn-soft:#33260F; --bad:#F07A6C; --bad-soft:#3A1B17;
    --card-shadow:0 1px 0 rgba(0,0,0,.3),0 1px 3px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#11141B; --surface:#1A1E28; --surface-2:#151922; --line:#2B3140; --line-strong:#3A4152;
  --ink:#E8EBF1; --muted:#A0A8B8; --faint:#737C8E;
  --accent:#7F97FF; --accent-ink:#0F1320; --accent-soft:#232C4B; --accent-line:#3C4B80;
  --good:#4CC38A; --good-soft:#15301F; --warn:#E3A54B; --warn-soft:#33260F; --bad:#F07A6C; --bad-soft:#3A1B17;
  --card-shadow:0 1px 0 rgba(0,0,0,.3),0 1px 3px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{background:var(--ground)}
body{font-family:var(--sans);color:var(--ink);font-size:15px;line-height:1.6;padding-inline:16px;padding-block:0 48px}
h1,h2,h3{line-height:1.3;text-wrap:balance;margin:0}
h1{font-size:1.6rem;font-weight:700}
h2{font-size:1.2rem;font-weight:600}
h3{font-size:1rem;font-weight:600}
p{margin:0}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.eyebrow{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--ground) 92%,transparent);backdrop-filter:blur(8px);margin-inline:-16px;padding:12px 16px 0;border-bottom:1px solid var(--line)}
.top-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:space-between}
.brand{display:flex;align-items:baseline;gap:10px}
.brand b{font-weight:700;font-size:1.05rem}
.who{font-size:.85rem;color:var(--muted);display:flex;align-items:center;gap:8px}
.who img{width:22px;height:22px;border-radius:50%}
.tabs{display:flex;gap:4px;overflow-x:auto;margin-top:8px}
.tab{border:0;background:none;padding:10px 14px;border-bottom:2px solid transparent;color:var(--muted);font-weight:500;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--good);margin-left:6px;vertical-align:middle}

main{padding-top:24px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.btn{border:1px solid var(--line-strong);background:var(--surface);padding:9px 16px;border-radius:8px;font-weight:500}
.btn:hover{border-color:var(--accent-line)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{border-color:transparent;background:none;color:var(--muted)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;padding:2px 10px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted)}
.pill.good{background:var(--good-soft);border-color:transparent;color:var(--good)}
.pill.warn{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.notice{padding:12px 14px;border-radius:8px;background:var(--warn-soft);color:var(--ink);font-size:.9rem}
.notice.info{background:var(--accent-soft)}

/* landing */
.hero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:820px){.hero{grid-template-columns:1fr}}
.lede{font-size:1.05rem;color:var(--muted);max-width:62ch}
.method{display:flex;flex-direction:column;gap:10px;padding:18px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.method .meta{display:flex;gap:8px;flex-wrap:wrap}
.steps{margin:0;padding-left:1.2em;color:var(--muted);font-size:.9rem}
.minicards{display:flex;flex-wrap:wrap;gap:6px}
.mini{font-size:.78rem;padding:3px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface-2)}

/* card sort */
.cs-layout{display:grid;grid-template-columns:minmax(260px,340px) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:860px){.cs-layout{grid-template-columns:1fr}}
.pile{position:sticky;top:120px;max-height:calc(100vh - 140px);overflow:auto}
@media (max-width:860px){.pile{position:static;max-height:none}}
.zone{border:1.5px dashed var(--line-strong);border-radius:var(--r);padding:12px;background:var(--surface-2);min-height:64px;transition:background .15s,border-color .15s}
.zone.target{border-color:var(--accent);background:var(--accent-soft)}
.zone.can-drop{border-color:var(--accent-line)}
.cards{display:flex;flex-wrap:wrap;gap:8px}
.card{position:relative;display:flex;flex-direction:column;gap:2px;width:100%;max-width:200px;flex:1 1 150px;text-align:left;padding:9px 11px 9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);box-shadow:var(--card-shadow);user-select:none;touch-action:manipulation}
.card:hover{border-color:var(--accent-line)}
.card[aria-pressed="true"]{border-color:var(--accent);outline:2px solid var(--accent);outline-offset:0}
.card .nm{font-weight:600;font-size:.9rem;line-height:1.3}
.card .ds{font-size:.76rem;color:var(--muted);line-height:1.35}
.card .no{position:absolute;top:6px;right:8px;font-family:var(--mono);font-size:.65rem;color:var(--faint)}
.groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.group{display:flex;flex-direction:column;gap:8px}
.group-head{display:flex;gap:6px;align-items:center}
.group-head input{flex:1;min-width:0;border:1px solid var(--line-strong);border-radius:6px;padding:6px 8px;background:var(--surface);font-weight:600}
.group-head input.invalid{border-color:var(--bad)}
.icon-btn{border:0;background:none;color:var(--muted);padding:4px 6px;border-radius:6px}
.icon-btn:hover{background:var(--surface-2);color:var(--ink)}
.group .count{font-family:var(--mono);font-size:.75rem;color:var(--muted)}
.zone .cards .card{max-width:none;flex:1 1 140px}
.unsure-zone{border-style:solid;background:var(--warn-soft);border-color:transparent}
.hint{font-size:.85rem;color:var(--muted)}
.bar{position:sticky;bottom:0;margin-top:16px;padding:12px 16px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));background:var(--surface);border:1px solid var(--line);border-radius:var(--r);display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;box-shadow:0 -4px 16px rgba(0,0,0,.05)}

/* tree test */
.tt{max-width:760px;margin:0 auto}
.task{padding:16px 18px;border-radius:var(--r);background:var(--accent-soft);border:1px solid var(--accent-line)}
.task .q{font-size:1.08rem;font-weight:500}
.tree{list-style:none;margin:0;padding:0}
.tree ul{list-style:none;margin:0;padding-left:22px;border-left:1px solid var(--line);margin-left:11px}
.node{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:0;background:none;padding:9px 10px;border-radius:6px;font-size:.95rem}
.node:hover{background:var(--surface-2)}
.node .chev{width:14px;display:inline-block;color:var(--muted);transition:transform .15s;font-family:var(--mono)}
.node[aria-expanded="true"] .chev{transform:rotate(90deg)}
.node.leaf .chev{visibility:hidden}
.node.cat{font-weight:600}
.node.chosen{background:var(--accent);color:var(--accent-ink)}
.progress{height:6px;border-radius:999px;background:var(--line);overflow:hidden}
.progress > i{display:block;height:100%;background:var(--accent);transition:width .25s}
.survey label{display:flex;gap:8px;align-items:center;padding:4px 0}
textarea{width:100%;min-height:90px;border:1px solid var(--line-strong);border-radius:8px;padding:10px;background:var(--surface)}

/* results */
.lock{max-width:380px;margin:40px auto;text-align:center}
.pin{display:flex;gap:8px;justify-content:center;margin:16px 0}
.pin input{width:52px;height:60px;text-align:center;font-size:1.6rem;font-family:var(--mono);border:1px solid var(--line-strong);border-radius:10px;background:var(--surface)}
.pin.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media (prefers-reduced-motion:reduce){.pin.shake{animation:none}*{transition:none!important}}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{padding:14px 16px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.kpi .v{font-family:var(--mono);font-size:1.6rem;font-weight:500}
.kpi .l{font-size:.82rem;color:var(--muted)}
.subtabs{display:flex;gap:6px;flex-wrap:wrap}
.subtab{border:1px solid var(--line);background:var(--surface);padding:6px 14px;border-radius:999px;font-size:.88rem;color:var(--muted)}
.subtab[aria-selected="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.scroll{overflow-x:auto}
table.data{border-collapse:collapse;width:100%;font-size:.88rem}
table.data th,table.data td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.data th{font-weight:600;color:var(--muted);font-size:.8rem;white-space:nowrap}
table.data td.num{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.best{background:var(--good-soft)}
.meter{display:flex;align-items:center;gap:8px;min-width:120px}
.meter .track{flex:1;height:6px;background:var(--line);border-radius:999px;overflow:hidden}
.meter .track i{display:block;height:100%;background:var(--accent)}
.meter.good .track i{background:var(--good)}
.meter.warn .track i{background:var(--warn)}
.meter.bad .track i{background:var(--bad)}
.cluster{border:1px solid var(--line);border-radius:var(--r);padding:14px;background:var(--surface);display:flex;flex-direction:column;gap:8px}
.cluster-names{display:flex;flex-wrap:wrap;gap:6px}
.tagname{font-size:.8rem;padding:2px 8px;border-radius:6px;background:var(--accent-soft);color:var(--ink)}
.tagname b{font-family:var(--mono);font-weight:500;color:var(--muted);margin-left:4px}
.matrix{border-collapse:collapse;font-size:.7rem}
.matrix td{width:16px;height:16px;padding:0;border:1px solid var(--surface)}
.matrix th{font-weight:500;color:var(--muted);white-space:nowrap;padding:0 6px 0 0;text-align:right;font-size:.72rem}
.matrix thead th{writing-mode:vertical-rl;transform:rotate(180deg);text-align:left;padding:6px 0 0;height:120px}
details{border:1px solid var(--line);border-radius:8px;padding:10px 14px;background:var(--surface)}
details summary{cursor:pointer;font-weight:500}
.range{display:flex;align-items:center;gap:10px}
.range input{width:180px}
.avatar{width:22px;height:22px;border-radius:50%;vertical-align:middle;margin-right:6px}
.ia-map{display:flex;flex-direction:column;align-items:stretch}
.ia-root{align-self:center;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative;margin-bottom:26px;font-size:.8rem;font-weight:600;color:var(--muted)}
.ia-root svg{width:40px;height:40px;fill:var(--faint)}
.ia-root::after{content:"";position:absolute;left:50%;top:100%;width:2px;height:26px;background:var(--ink)}
.ia-cols{display:flex;gap:18px;align-items:flex-start;padding-top:22px;min-width:max-content;position:relative}
.ia-cols::before{content:"";position:absolute;top:0;left:94px;right:94px;height:2px;background:var(--ink)}
.ia-col{width:188px;flex:0 0 188px;display:flex;flex-direction:column;position:relative}
.ia-col::before{content:"";position:absolute;left:50%;top:-22px;width:2px;height:22px;background:var(--ink)}
.ia-head{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:2px;min-height:48px;padding:8px 10px;background:#4FBFE0;color:#fff}
.ia-head b{font-size:.9rem;font-weight:600}
.ia-head span{font-size:.68rem;opacity:.92;line-height:1.3}
.ia-items{display:flex;flex-direction:column;gap:12px;position:relative;padding:18px 0 0 26px}
.ia-items::before{content:"";position:absolute;left:12px;top:0;bottom:var(--tail,20px);width:2px;background:var(--ink)}
.ia-item,.ia-sub{position:relative;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:2px;min-height:40px;padding:7px 10px;background:var(--c,#2F3A74);color:var(--ct,#fff);font-size:.82rem;line-height:1.3}
.ia-item::before,.ia-sub::before{content:"";position:absolute;left:-14px;top:50%;width:10px;height:2px;background:var(--ink)}
.ia-item::after,.ia-sub::after{content:"";position:absolute;left:-5px;top:calc(50% - 4px);border:4px solid transparent;border-left:5px solid var(--ink);border-right:0}
.ia-sub{font-weight:600}
.ia-subitems{display:flex;flex-direction:column;gap:10px;position:relative;padding:10px 0 0 24px;margin-left:0}
.ia-subitems::before{content:"";position:absolute;left:10px;top:0;bottom:20px;width:2px;background:var(--ink)}
.ia-item.lvl3{background:color-mix(in srgb,var(--c) 22%,var(--surface));color:var(--ink);outline:1.5px dashed var(--c);outline-offset:-1.5px}
.ia-item small{font-size:.66rem;opacity:.9;line-height:1.25}
.ia-badge{position:absolute;top:-8px;right:-6px;font-size:.62rem;font-weight:700;padding:1px 6px;border-radius:999px;background:var(--surface);border:1.5px solid;line-height:1.4}
.ia-badge.moved{color:var(--bad);border-color:var(--bad)}
.ia-badge.link{color:var(--accent);border-color:var(--accent)}
.ia-badge.weak{color:var(--warn);border-color:var(--warn)}
.ia-tree{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.ia-tree .ia-tree{padding-left:18px;margin:6px 0 4px 8px;border-left:1px solid var(--line);flex-direction:row;flex-wrap:wrap;gap:6px}
.ia-tree li{min-width:0}
.ia-tree .ia-tree:has(> li > .ia-cat){flex-direction:column;flex-wrap:nowrap}
.ia-cat{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px;font-weight:600;padding:4px 0}
.ia-meta{font-weight:400;font-size:.78rem;color:var(--muted)}
.ia-leaf{display:inline-flex;flex-direction:column;gap:2px;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);font-size:.86rem;max-width:320px}
.ia-leaf.moved{border-color:var(--bad);background:var(--bad-soft)}
.ia-leaf.link{border-color:var(--accent);background:var(--accent-soft);border-style:dashed}
.ia-leaf.weak{border-color:var(--warn);background:var(--warn-soft)}
.ia-note{font-size:.74rem;color:var(--muted)}
.ia-dot{display:inline-block;width:10px;height:10px;border-radius:3px;vertical-align:middle;border:1px solid}
.ia-dot.moved{background:var(--bad-soft);border-color:var(--bad)}
.ia-dot.link{background:var(--accent-soft);border-color:var(--accent);border-style:dashed}
.ia-dot.weak{background:var(--warn-soft);border-color:var(--warn)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:8px;font-size:.9rem;z-index:50}
</style>

<div class="wrap">
  <header class="top">
    <div class="top-row">
      <div class="brand"><b>จัดหมวด Component</b><span class="muted small">IA lab · design system portal</span></div>
      <div class="who" id="who"><span class="muted small">กำลังเชื่อมต่อ…</span></div>
    </div>
    <nav class="tabs" role="tablist" aria-label="ส่วนของหน้า">
      <button class="tab" role="tab" id="tab-home" data-view="home" aria-selected="true">หน้าแรก</button>
      <button class="tab" role="tab" id="tab-cs" data-view="cs" aria-selected="false">1 · Card sort</button>
      <button class="tab" role="tab" id="tab-tt" data-view="tt" aria-selected="false">2 · Tree test</button>
      <button class="tab" role="tab" id="tab-res" data-view="res" aria-selected="false">ผลลัพธ์</button>
    </nav>
  </header>
  <main id="view"></main>
</div>

<script>
/* ======================= CONFIG ======================= */
/* รายการการ์ด: วิเคราะห์จาก eBay Evo, Carbon, Astryx, Material 2, SGDS + flow ธนาคาร */
const CARDS = [
  ["button","Button","ปุ่มกดสั่งงาน เช่น ยืนยัน, ถัดไป"],
  ["icon-button","Icon button","ปุ่มที่มีแค่ไอคอน เช่น ปิด, แชร์"],
  ["link","Link","ข้อความที่กดแล้วไปหน้าอื่น"],
  ["segmented","Segmented control","ปุ่มเลือก 1 จากกลุ่มที่อยู่ติดกัน"],
  ["text-field","Text field","ช่องกรอกข้อความบรรทัดเดียว"],
  ["text-area","Text area","ช่องกรอกข้อความหลายบรรทัด"],
  ["select","Select / Dropdown","เลือก 1 ตัวเลือกจากรายการที่ซ่อนไว้"],
  ["combobox","Combobox","พิมพ์ค้นแล้วเลือกจากรายการ"],
  ["checkbox","Checkbox","ติ๊กเลือกได้หลายข้อ"],
  ["radio","Radio button","เลือกได้ข้อเดียวจากตัวเลือกที่เห็นทั้งหมด"],
  ["switch","Switch","เปิด/ปิดค่าทันที"],
  ["stepper-input","Number stepper","ปุ่ม − / + ปรับจำนวน"],
  ["date-picker","Date picker","เลือกวันที่จากปฏิทิน"],
  ["file-upload","File upload","แนบไฟล์หรือรูป"],
  ["search","Search field","ช่องค้นหา"],
  ["pin","PIN / OTP input","ช่องกรอกรหัสทีละหลัก"],
  ["tabs","Tabs","สลับเนื้อหาในหน้าเดียวกัน"],
  ["top-bar","Top app bar","แถบบนสุด มีชื่อหน้า ปุ่มย้อนกลับ"],
  ["bottom-nav","Bottom navigation","เมนูหลักด้านล่างจอ"],
  ["side-nav","Side navigation","เมนูด้านข้าง (เว็บ/แท็บเล็ต)"],
  ["breadcrumb","Breadcrumb","บอกตำแหน่ง หน้าแรก › หมวด › หน้านี้"],
  ["pagination","Pagination","เลขหน้า 1 2 3 …"],
  ["stepper","Stepper","แสดงขั้นตอน 1 → 2 → 3"],
  ["toast","Toast","ข้อความแจ้งสั้น ๆ แล้วหายไปเอง"],

function toast(msg){ const t=h("div",{class:"toast",role:"status",text:msg}); document.body.append(t); setTimeout(()=>t.remove(),2600); }

(async function connect(){
  try{
    [db, userNs, downloadsNs] = await Promise.all([claude.use("db"), claude.use("user"), claude.use("downloads")]);
    if(userNs){ me = await userNs.me(); uid = me.id; isOwner = me.isOwner; }
    if(db && uid){
      const snap = await db.doc("responses/"+uid).get();
      if(snap.exists) myDoc = JSON.parse(JSON.stringify(snap.data()));
    }
  }catch(e){ dbError = e; }
  connecting=false; renderWho(); render();
})();
function renderWho(){
  const w=$("#who"); w.textContent="";
  if(connecting){ w.append(h("span",{class:"muted small",text:"กำลังเชื่อมต่อ…"})); return; }
  if(!db||!uid){ w.append(h("span",{class:"pill warn",text:"บันทึกคำตอบไม่ได้ในหน้านี้"})); return; }
  w.append(h("img",{src:me.avatarUrl,alt:""}), h("span",{text:(me.name||"คุณ")}));
}
async function saveMyDoc(){
  if(!db||!uid) throw {code:"no_db"};
  myDoc.uid=uid; myDoc.updatedAt=new Date().toISOString();
  const nm=(typeof currentName==="function"? currentName() : "") || myDoc.displayName || "";
  myDoc.displayName = nm.slice(0,60);
  await db.doc("responses/"+uid).set(myDoc);
}

function treeEl(nodes){

  nodes.forEach(node=>{
    const li=h("li",{role:"treeitem"});
    const btn=h("button",{class:"node "+(node.leaf?"leaf":"cat")+(tt.chosen===node?" chosen":""),type:"button","aria-expanded":node.leaf?null:String(tt.open.has(node.id))}, h("span",{class:"chev",text:"›"}), h("span",{text:node.n}));

        h("div",{class:"small muted",text:`เวลากลาง ${fmtSec(stats[k].rows[ti].med)} · ข้าม ${stats[k].rows[ti].skip}%`}))); });
    pane.append(d);
  });
  withData.forEach(k=>{ const hard={}, comments=[]; byV[k].forEach(d=>{ (d.treetest.survey?.hardLabels||[]).forEach(l=>hard[l]=(hard[l]||0)+1); if(d.treetest.survey?.comment) comments.push(d.treetest.survey.comment); });
    pane.append(h("section",{class:"panel stack"}, h("h2",{text:`${TREES[k].label}: ชื่อหมวดที่คนบอกว่าเข้าใจยาก`}),
      Object.keys(hard).length? h("div",{class:"cluster-names"}, Object.entries(hard).sort((a,b)=>b[1]-a[1]).map(([n,c])=>h("span",{class:"tagname"}, n, h("b",{text:"×"+c})))) : h("p",{class:"muted small",text:"ไม่มีใครเลือก"}),
      comments.length? h("ul",{class:"small"}, comments.map(c=>h("li",{text:c}))) : null)); });
}
async function drawPeople(pane, docs){
  const ids=docs.map(d=>d.uid).filter(Boolean);
  const ps = userNs && ids.length? await userNs.profiles(ids) : {};
  pane.append(h("section",{class:"panel"}, h("div",{class:"scroll"}, h("table",{class:"data"},
    h("thead",{}, h("tr",{}, h("th",{text:"ชื่อ"}), h("th",{text:"Card sort"}), h("th",{text:"Tree test"}), h("th",{text:"ลำดับ"}), h("th",{text:"อัปเดตล่าสุด"}))),
    h("tbody",{}, docs.map(d=>{ const p=ps[d.uid]||{}; return h("tr",{},
      h("td",{}, p.avatarUrl? h("img",{class:"avatar",src:p.avatarUrl,alt:""}):null, h("span",{text:d.displayName||p.name||"ไม่ทราบชื่อ"}), (d.displayName&&p.name&&p.name!==d.displayName)? h("div",{class:"small muted",text:"บัญชี: "+p.name}) : null),
      h("td",{}, d.cardsort? h("span",{class:"pill good",text:`${d.cardsort.groups.length} กลุ่ม`}) : h("span",{class:"pill",text:"—"})),
      h("td",{}, d.treetest? h("span",{class:"pill good",text:"เมนู "+d.treetest.version}) : (d.treeVersion? h("span",{class:"pill warn",text:"เริ่มแล้ว ("+d.treeVersion+")"}) : h("span",{class:"pill",text:"—"}))),
      h("td",{class:"small muted",text: d.treetest? (d.treetest.didCardSortFirst? "ทำ card sort ก่อน" : "ทำ tree test ก่อน") : ""}),
      h("td",{class:"num small",text:d.updatedAt? new Date(d.updatedAt).toLocaleString("th-TH"):"—"})); }))))));
}
async function exportCsv(){
  if(!resDocs||!resDocs.length){ toast("ยังไม่มีข้อมูลให้ส่งออก"); return; }
  if(!downloadsNs){ toast("หน้านี้ส่งออกไฟล์ไม่ได้"); return; }
  const esc=v=>`"${String(v??"").replace(/"/g,'""')}"`;
  const rows=[["respondent","name","method","tree_version","task_or_group","value","success","direct","skipped","time_ms","path"]];
  resDocs.forEach((d,i)=>{ const r="P"+String(i+1).padStart(2,"0"); const n=d.displayName||"";
    d.cardsort?.groups.forEach(g=>g.cards.forEach(c=>rows.push([r,n,"cardsort","",g.name,CARD_BY_ID[c]?.name||c,"","","","",""])));
    d.cardsort?.unsure.forEach(c=>rows.push([r,n,"cardsort","","(ไม่แน่ใจ)",CARD_BY_ID[c]?.name||c,"","","","",""]));
    d.treetest?.results.forEach(x=>rows.push([r,n,"treetest",d.treetest.version,x.taskId,x.chosen||"",x.success,x.direct??"",x.skipped,x.timeMs,(x.path||[]).join(" > ")])); });
  const csv="﻿"+rows.map(r=>r.map(esc).join(",")).join("\n");
  try{ await downloadsNs.save({filename:"ia-lab-results.csv", data:csv}); }catch(e){ if(e.code!=="declined") toast("ส่งออกไม่สำเร็จ"); }
}

render();
